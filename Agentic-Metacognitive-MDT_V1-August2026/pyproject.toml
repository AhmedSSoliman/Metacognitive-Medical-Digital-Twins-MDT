[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-metacognitive-mdt"
version = "0.1.0"
description = "Agentic Metacognitive Medical Digital Twins -- ported package layout (August 2026)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

# Core dependency floors mirror requirements-core.txt / requirements-training.txt / requirements-eval.txt,
# pulled from the source repo's requirements.txt (Agentic-DT_V1-July).
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "pyarrow>=16.0.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Heavy training/inference stack -- see requirements-training.txt
train = [
    "torch>=2.2.0",
    "transformers>=4.42.0",
    "peft>=0.11.0",
    "trl>=0.9.4",
    "unsloth",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.31.0",
    "datasets>=2.19.0",
    "sentence-transformers>=3.0.0",
    "wandb>=0.17.0",
    "matplotlib>=3.8.0",
    "python-docx>=1.1.0",
]
# Test-only dependencies -- see requirements-dev.txt
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
include = [
    "core*",
    "data*",
    "evaluation*",
    "sandbox*",
    "training*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
